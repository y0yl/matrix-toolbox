<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Toolbox</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>Matrix Toolbox</h1>
    <p class="subtitle">矩阵运算 · 行列式 · 特征值 · 证明 · AI解题</p>
  </header>

  <section class="op-section">
    <div class="op-tabs">
      <button class="op-tab active" data-cat="basic">基本运算</button>
      <button class="op-tab" data-cat="transform">变换化简</button>
      <button class="op-tab" data-cat="property">性质求解</button>
      <button class="op-tab" data-cat="proof">性质证明</button>
      <button class="op-tab" data-cat="ai">AI解题</button>
    </div>
    <div class="op-grid" id="op-grid"></div>
  </section>

  <section class="input-section" id="section-a">
    <h3>矩阵 A</h3>
    <div class="size-row">
      <label>行</label><input type="number" id="rows" min="1" max="10" value="3">
      <label>列</label><input type="number" id="cols" min="1" max="10" value="3">
      <button id="btn-create" class="btn btn-primary">生成</button>
      <button id="btn-example" class="btn btn-secondary">示例</button>
    </div>
    <div class="matrix-input-wrap"><table id="matrix-a"></table></div>
  </section>

  <section class="input-section" id="section-b" style="display:none">
    <h3>矩阵 B</h3>
    <div class="size-row">
      <label>行</label><input type="number" id="rows2" min="1" max="10" value="3">
      <label>列</label><input type="number" id="cols2" min="1" max="10" value="3">
    </div>
    <div class="matrix-input-wrap"><table id="matrix-b"></table></div>
  </section>

  <section class="input-section" id="section-scalar" style="display:none">
    <h3>标量 k</h3>
    <div class="size-row">
      <input type="text" id="scalar-val" value="2" class="scalar-input">
      <span class="hint">支持分数如 3/2</span>
    </div>
  </section>

  <section class="input-section" id="section-ai" style="display:none">
    <h3>输入线性代数问题</h3>
    <textarea id="ai-input" class="ai-textarea" placeholder="例：求矩阵 [1,2;3,4] 的特征值和特征向量&#10;例：证明 n 阶单位阵的行列式等于1&#10;例：解线性方程组 x + 2y = 3, 2x + 5y = 7" rows="4"></textarea>
    <div class="symbol-panel" id="symbol-panel" style="display:none">
      <div class="symbol-group">
        <span class="symbol-label">矩阵格式</span>
        <button class="sym-btn" data-action="matrix-bracket" data-format="bracket">矩阵 [ ]</button>
        <button class="sym-btn" data-action="matrix-paren" data-format="paren">矩阵 ( )</button>
        <button class="sym-btn" data-action="det" data-format="det">行列式</button>
      </div>
      <div class="symbol-group">
        <span class="symbol-label">运算符号</span>
        <button class="sym-btn" data-sym="det(A)">det(A)</button>
        <button class="sym-btn" data-sym="tr(A)">tr(A)</button>
        <button class="sym-btn" data-sym="A^(-1)">A⁻¹</button>
        <button class="sym-btn" data-sym="A^T">Aᵀ</button>
        <button class="sym-btn" data-sym="A*">伴随 A*</button>
      </div>
      <div class="symbol-group">
        <span class="symbol-label">希腊字母</span>
        <button class="sym-btn" data-sym="λ">λ</button>
        <button class="sym-btn" data-sym="α">α</button>
        <button class="sym-btn" data-sym="β">β</button>
        <button class="sym-btn" data-sym="μ">μ</button>
        <button class="sym-btn" data-sym="σ">σ</button>
        <button class="sym-btn" data-sym="Δ">Δ</button>
      </div>
      <div class="symbol-group">
        <span class="symbol-label">常用表达</span>
        <button class="sym-btn" data-sym="rank(A)">rank(A)</button>
        <button class="sym-btn" data-sym="ker(A)">ker(A)</button>
        <button class="sym-btn" data-sym="dim(V)">dim(V)</button>
        <button class="sym-btn" data-sym="x₁, x₂, ..., xₙ">x₁...xₙ</button>
        <button class="sym-btn" data-sym="∑ᵢ₌₁ⁿ">求和</button>
        <button class="sym-btn" data-sym="∞">∞</button>
        <button class="sym-btn" data-sym="∀">∀</button>
        <button class="sym-btn" data-sym="∃">∃</button>
        <button class="sym-btn" data-sym="∈">∈</button>
      </div>
    </div>
  </section>

  <div class="action-row">
    <button id="btn-calc" class="btn btn-accent">计算</button>
    <button id="btn-symbols" class="btn btn-secondary" style="display:none">符号面板</button>
    <button id="btn-clear" class="btn btn-secondary">清空</button>
  </div>

  <div id="progress" class="progress-bar" style="display:none">
    <div class="progress-dot"></div>
    <span class="progress-text">AI 正在思考...</span>
  </div>

  <section class="result-section" id="result-section" style="display:none">
    <h2 id="result-title">结果</h2>
    <div id="result-content"></div>
  </section>

  <!-- 矩阵生成弹窗 -->
  <div class="modal-overlay" id="matrix-modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">生成矩阵</div>
      <div class="modal-body">
        <div class="modal-row">
          <label>行数</label>
          <input type="number" id="modal-rows" min="1" max="8" value="2">
        </div>
        <div class="modal-row" id="modal-cols-row">
          <label>列数</label>
          <input type="number" id="modal-cols" min="1" max="8" value="2">
        </div>
      </div>
      <div class="modal-grid" id="modal-grid"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-ok">插入</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/script.js"></script>
</body>
</html>
